name: Verify live website interactions
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        env:
          NODE_OPTIONS: --use-system-ca
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 120000
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test the actual GitHub Pages website
        env:
          NODE_OPTIONS: --use-system-ca
        run: |
          cat > smoke-test.mjs <<'EOF'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const errors = [];
          const failed = [];
          page.on("pageerror", e => errors.push("PAGE ERROR: " + e.message));
          page.on("console", m => { if (m.type() === "error") errors.push("CONSOLE: " + m.text()); });
          page.on("requestfailed", r => failed.push(r.url() + " => " + r.failure()?.errorText));
          let done = false;
          try {
            const url = "https://hofong159.github.io/csu-arch-order-gpt/?smoke=" + Date.now();
            const response = await page.goto(url, { waitUntil: "domcontentloaded", timeout: 60000 });
            await page.waitForTimeout(1500);
            console.log("URL:", page.url());
            console.log("HTTP:", response?.status());
            console.log("TITLE:", await page.title());
            console.log("APP SCRIPT:", await page.locator("script[src*='app.js']").getAttribute("src"));
            await page.locator("#view h2").first().waitFor({ timeout: 10000 });
            const initialHeading = await page.locator("#view h2").first().textContent();
            console.log("INITIAL H2:", initialHeading);
            if (!initialHeading) throw new Error("APP_DID_NOT_RENDER");
            const tabs = await page.locator(".tab").allTextContents();
            console.log("PUBLIC TABS:", JSON.stringify(tabs));
            if (tabs.some(t => t.includes("雙向借用"))) throw new Error("BIDIRECTIONAL_BORROWING_TAB_STILL_VISIBLE");
            await page.getByRole("button", { name: "借用正修微工坊" }).click();
            await page.waitForTimeout(300);
            const workshopHeading = await page.locator("#view h2").first().textContent().catch(() => "");
            console.log("AFTER TAB CLICK:", workshopHeading);
            if (!workshopHeading.includes("正修微工坊")) throw new Error("TAB_CLICK_FAILED: " + workshopHeading);
            const appSource = await page.evaluate(async () => await (await fetch(document.querySelector("script[src*='app.js']").src)).text());
            if (!appSource.includes('p.onclick=async(event)=>') || !appSource.includes('quickSeedBtn') || !appSource.includes('items') || !appSource.includes('schedule') || !appSource.includes('bookings')) {
              throw new Error("ADMIN_DELEGATED_NAV_OR_IMPORT_ACTION_MISSING");
            }
            console.log("ADMIN NAV HANDLER:", appSource.includes('p.onclick=async(event)=>'));
            console.log("IMPORT ACTION:", appSource.includes('quickSeedBtn'));
            await page.getByRole("button", { name: "管理員後台" }).click();
            const modalVisible = await page.locator("#adminModal").isVisible();
            console.log("ADMIN MODAL VISIBLE:", modalVisible);
            if (!modalVisible) throw new Error("ADMIN_MODAL_CLICK_FAILED");
            await page.locator("#adminClose").click();
            if (await page.locator("#adminModal").isVisible()) throw new Error("ADMIN_MODAL_CLOSE_FAILED");
            const fatalErrors = errors.filter(x => x.startsWith("PAGE ERROR:") || x.includes(" is not defined") || x.includes("SyntaxError"));
            if (fatalErrors.length) throw new Error("BROWSER_RUNTIME_ERRORS: " + fatalErrors.join(" | "));
            done = true;
          } catch (e) {
            console.error("SMOKE TEST FAILED:", e.stack || e);
          } finally {
            console.log("PAGE_ERRORS:", JSON.stringify(errors));
            console.log("FAILED_REQUESTS:", JSON.stringify(failed));
            await browser.close();
          }
          if (!done) process.exit(1);
          EOF
          node smoke-test.mjs
