name: Verify live website interactions
on:
  workflow_run:
    workflows: ["Deploy static site to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-test:
    if: \${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test the actual GitHub Pages website
        run: |
          cat > smoke-test.mjs <<'EOF'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const errors = [];
          const failed = [];
          page.on("pageerror", e => errors.push("PAGE ERROR: " + e.message));
          page.on("console", m => { if (m.type() === "error") errors.push("CONSOLE: " + m.text()); });
          page.on("requestfailed", r => failed.push(r.url() + " => " + r.failure()?.errorText));
          let done = false;
          try {
            const url = "https://hofong159.github.io/csu-arch-order-gpt/?smoke=" + Date.now();
            const response = await page.goto(url, { waitUntil: "domcontentloaded", timeout: 60000 });
            await page.waitForTimeout(1500);
            console.log("URL:", page.url());
            console.log("HTTP:", response?.status());
            console.log("TITLE:", await page.title());
            console.log("APP SCRIPT:", await page.locator("script[src*='app.js']").getAttribute("src"));
            console.log("INITIAL H2:", await page.locator("#view h2").first().textContent().catch(() => "(missing)"));
            await page.getByRole("button", { name: "雙向借用" }).click();
            await page.waitForTimeout(300);
            const borrowHeading = await page.locator("#view h2").first().textContent().catch(() => "");
            console.log("AFTER TAB CLICK:", borrowHeading);
            if (!borrowHeading.includes("雙向借用")) throw new Error("TAB_CLICK_FAILED: " + borrowHeading);
            await page.getByRole("button", { name: "管理員後台" }).click();
            const modalVisible = await page.locator("#adminModal").isVisible();
            console.log("ADMIN MODAL VISIBLE:", modalVisible);
            if (!modalVisible) throw new Error("ADMIN_MODAL_CLICK_FAILED");
            await page.locator("#adminClose").click();
            if (await page.locator("#adminModal").isVisible()) throw new Error("ADMIN_MODAL_CLOSE_FAILED");
            done = true;
          } catch (e) {
            console.error("SMOKE TEST FAILED:", e.stack || e);
          } finally {
            console.log("PAGE_ERRORS:", JSON.stringify(errors));
            console.log("FAILED_REQUESTS:", JSON.stringify(failed));
            await browser.close();
          }
          if (!done) process.exit(1);
          EOF
          node smoke-test.mjs
