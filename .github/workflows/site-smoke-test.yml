name: Verify live website interactions
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        env:
          NODE_OPTIONS: --use-system-ca
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 120000
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test the actual GitHub Pages website
        env:
          NODE_OPTIONS: --use-system-ca
        run: |
          cat > smoke-test.mjs <<'EOF'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const errors = [];
          const failed = [];
          page.on("pageerror", e => errors.push("PAGE ERROR: " + e.message));
          page.on("console", m => { if (m.type() === "error") errors.push("CONSOLE: " + m.text()); });
          page.on("requestfailed", r => failed.push(r.url() + " => " + r.failure()?.errorText));
          let done = false;
          try {
            const url = "https://hofong159.github.io/csu-arch-order-gpt/?smoke=" + Date.now();
            let response = await page.goto(url, { waitUntil: "domcontentloaded", timeout: 60000 });
            // GitHub Pages deploys asynchronously after a push. Wait for this fix's cache
            // version so the test does not accidentally examine the previous deployed build.
            let appAsset = "";
            for (let attempt = 0; attempt < 30; attempt++) {
              await page.waitForTimeout(2500);
              appAsset = await page.locator("script[src*='app.js']").getAttribute("src").catch(() => "");
              if (appAsset.includes("20261026-weekly-board4")) break;
              response = await page.goto(url + "&retry=" + attempt, { waitUntil: "domcontentloaded", timeout: 60000 });
            }
            if (!appAsset.includes("20261026-weekly-board4")) throw new Error("LATEST_GITHUB_PAGES_ASSET_NOT_DEPLOYED: " + appAsset);
            console.log("URL:", page.url());
            console.log("HTTP:", response?.status());
            console.log("TITLE:", await page.title());
            console.log("APP SCRIPT:", await page.locator("script[src*='app.js']").getAttribute("src"));
            await page.locator("#view h2").first().waitFor({ timeout: 10000 });
            const initialHeading = await page.locator("#view h2").first().textContent();
            console.log("INITIAL H2:", initialHeading);
            if (!initialHeading) throw new Error("APP_DID_NOT_RENDER");
            await page.waitForFunction(() => typeof db !== "undefined" && !!db && typeof sdk !== "undefined" && typeof firebaseConfig !== "undefined", { timeout: 15000 });
            const firestoreProbe = await page.evaluate(async () => {
              const started = Date.now();
              try {
                const snap = await sdk.getDocs(sdk.collection(db, "items"));
                return { ok: true, count: snap.size, elapsedMs: Date.now() - started };
              } catch (e) {
                return { ok: false, code: e && e.code || "", message: e && e.message || String(e), elapsedMs: Date.now() - started };
              }
            });
            console.log("PUBLIC FIRESTORE ITEMS PROBE:", JSON.stringify(firestoreProbe));
            if (!firestoreProbe.ok && !["permission-denied", "firestore-rest-http-403"].includes(firestoreProbe.code)) throw new Error("PUBLIC_FIRESTORE_READ_FAILED: " + JSON.stringify(firestoreProbe));
            const tabs = await page.locator(".tab").allTextContents();
            console.log("PUBLIC TABS:", JSON.stringify(tabs));
            if (!tabs.some(t => t.includes("雙向借用"))) throw new Error("BIDIRECTIONAL_BORROWING_TAB_MISSING");
            if (await page.locator("#publicWeekBoard").count() !== 1) throw new Error("PUBLIC_WEEK_BOARD_MISSING");
            await page.getByRole("button", { name: "設備借還登記（雙向借用）" }).click();
            await page.waitForTimeout(200);
            const borrowHeading = await page.locator("#view h2").first().textContent().catch(() => "");
            console.log("BORROW TAB HEADING:", borrowHeading);
            if (!borrowHeading.includes("雙向借用")) throw new Error("BORROW_TAB_CLICK_FAILED");
            await page.getByRole("button", { name: "借用正修微工坊" }).click();
            await page.waitForTimeout(300);
            const workshopTabActive = await page.locator('.tab[data-view="micro"]').evaluate(el => el.classList.contains("active"));
            console.log("WORKSHOP TAB ACTIVE:", workshopTabActive);
            if (!workshopTabActive) throw new Error("WORKSHOP_TAB_CLICK_FAILED");
            const appSource = await page.evaluate(async () => await (await fetch(document.querySelector("script[src*='app.js']").src)).text());
            if (!appSource.includes("async function restGetDocs") || !appSource.includes("Firestore REST API") ||
                !appSource.includes('p.onclick=async(event)=>') || appSource.includes('quickSeedBtn') ||
                !appSource.includes("weekly-admin-grid") || !appSource.includes("loadPublicWeeklyBoard") ||
                !appSource.includes("data-weekly-copy") || !appSource.includes("data-deletebooking") ||
                !appSource.includes('id="hours" type="text"') || !appSource.includes("items") ||
                !appSource.includes("schedule") || !appSource.includes("bookings")) {
              throw new Error("WEEKLY_BOARD_OR_ADMIN_CONTROLS_MISSING");
            }
            console.log("ADMIN NAV HANDLER:", appSource.includes('p.onclick=async(event)=>'));
            console.log("WEEKLY GRID:", appSource.includes("weekly-admin-grid"));
            console.log("BOOKING DELETE:", appSource.includes("data-deletebooking"));
            const featureFns = await page.evaluate(async () => {
              const originalItems = config.items;
              let mapped = [];
              try {
                config.items = [{id:"space_A",name:"A區",areaCode:"A",category:"booking"}];
                mapped = scheduleRowsFromText('日期,區域,開始時間,結束時間,課程名稱\n2026-10-24,A,13:00,13:45,基本設計','2026-10-24');
              } finally { config.items = originalItems; }
              const wrapped = {
                meta: { date: "2026-10-24" },
                data: { spaces: [{ id: "A", name: "A區", areaCode: "A" }] },
                result: { courses: [{ date: "115/10/24", area: "A", start: "下午1:00", end: "下午1:45", label: "巢狀舊課表" }] }
              };
              let wrappedCourse = [];
              const nestedOriginalItems = config.items;
              try {
                config.items = [{id:"space_A",name:"A區",areaCode:"A",category:"booking"}];
                wrappedCourse = scheduleRowsFromText(JSON.stringify(wrapped), "2026-10-24");
              } finally { config.items = nestedOriginalItems; }
              const previewHtml = recordCard({
                item: "A區", name: "測試", className: "建築四甲", date: "2026-10-24",
                start: "13:00", endTime: "16:00", hours: 3, status: "approved",
                checkedInAt: { toDate: () => new Date() }, checkedOutAt: { toDate: () => new Date() },
                photoIds: ["photo1"]
              }, "a".repeat(32), [{ id: "photo1", name: "smoke.jpg", dataUrl: "data:image/jpeg;base64,AAAA" }]);
              const canvas = document.createElement("canvas");
              canvas.width = 24; canvas.height = 24;
              canvas.getContext("2d").fillRect(0,0,24,24);
              const blob = await new Promise(resolve => canvas.toBlob(resolve,"image/png"));
              const photo = await compressImage(new File([blob],"smoke.png",{type:"image/png"}));
              return {
                legacyImporter: typeof importLegacySnapshot,
                firestoreTimeoutHelper: typeof withFirestoreTimeout,
                scheduleParser: typeof scheduleRowsFromText,
                nestedLegacyArray: legacyArray(wrapped, ["spaces"]).length === 1 && legacyArray(wrapped, ["courses"]).length === 1,
                photoCompressor: typeof compressImage,
                photoCleaner: typeof cleanupExpiredPhotos,
                courseBoard: typeof loadPublicWeeklyBoard,
                legacyExportSnippet: typeof LEGACY_EXPORT_SNIPPET === "string" && LEGACY_EXPORT_SNIPPET.includes(".getBoard(day)"),
                legacyExporterKeepsDate: LEGACY_EXPORT_SNIPPET.includes('item.date || "", item.endDate || ""'),
                csvRows: parseCsvText('日期,區域,開始時間,結束時間,課程名稱\n2026-10-24,A,13:00,13:45,基本設計').length,
                mappedCourseCount: mapped.length,
                mappedItemId: mapped[0]?.itemId || "",
                nestedCourseCount: wrappedCourse.length,
                nestedCourseDate: wrappedCourse[0]?.date || "",
                nestedCourseTime: wrappedCourse[0]?.start || "",
                nestedCourseItem: wrappedCourse[0]?.itemId || "",
                photoPreview: previewHtml.includes("photo-grid") && previewHtml.includes("data:image/jpeg;base64,AAAA"),
                pmTime: importTime('下午1:30'),
                parsedDate: importDate('2026/10/24',''),
                rocDate: importDate('115/10/24',''),
                photoCompressed: photo.startsWith("data:image/jpeg;base64,") && photo.length < 650000,
                legacyDateParsed: !!parseLegacyDateTime("2026-10-23T23:30:00","2026-10-24")
              };
            });
            console.log("FEATURE FUNCTIONS:", JSON.stringify(featureFns));
            if (featureFns.legacyImporter !== "function" || featureFns.firestoreTimeoutHelper !== "function" || featureFns.scheduleParser !== "function" ||
                !appSource.includes('withFirestoreTimeout(sdk.getDocs(sdk.collection(db,"schedule"))') ||
                !appSource.includes('withFirestoreTimeout(sdk.getDocs(sdk.collection(db,"bookings"))') ||
                featureFns.photoCompressor !== "function" || featureFns.photoCleaner !== "function" ||
                featureFns.courseBoard !== "function" || !featureFns.legacyExportSnippet || featureFns.csvRows !== 2 ||
                featureFns.mappedCourseCount !== 1 || featureFns.mappedItemId !== "space_A" ||
                featureFns.nestedLegacyArray !== true || featureFns.nestedCourseCount !== 1 ||
                featureFns.nestedCourseDate !== "2026-10-24" || featureFns.nestedCourseTime !== "13:00" ||
                featureFns.nestedCourseItem !== "space_A" || featureFns.photoPreview !== true ||
                featureFns.legacyExporterKeepsDate !== true || featureFns.pmTime !== "13:30" ||
                featureFns.parsedDate !== "2026-10-24" || featureFns.rocDate !== "2026-10-24" ||
                !featureFns.photoCompressed || !featureFns.legacyDateParsed ||
                !appSource.includes("data-openphoto") ||
                !appSource.includes("data-openlegacy") ||
                !appSource.includes("inlinePhotoRecords.forEach")) {
              throw new Error("TIMETABLE_PHOTO_OR_LEGACY_IMPORT_FEATURE_CHECK_FAILED");
            }
            await page.getByRole("button", { name: "管理員後台" }).click();
            const modalVisible = await page.locator("#adminModal").isVisible();
            console.log("ADMIN MODAL VISIBLE:", modalVisible);
            if (!modalVisible) throw new Error("ADMIN_MODAL_CLICK_FAILED");
            await page.locator("#adminClose").click();
            if (await page.locator("#adminModal").isVisible()) throw new Error("ADMIN_MODAL_CLOSE_FAILED");
            const fatalErrors = errors.filter(x => x.startsWith("PAGE ERROR:") || x.includes(" is not defined") || x.includes("SyntaxError"));
            if (fatalErrors.length) throw new Error("BROWSER_RUNTIME_ERRORS: " + fatalErrors.join(" | "));
            done = true;
          } catch (e) {
            console.error("SMOKE TEST FAILED:", e.stack || e);
          } finally {
            console.log("PAGE_ERRORS:", JSON.stringify(errors));
            console.log("FAILED_REQUESTS:", JSON.stringify(failed));
            await browser.close();
          }
          if (!done) process.exit(1);
          EOF
          node smoke-test.mjs
