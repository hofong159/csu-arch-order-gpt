name: Check Firebase API deployment
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check whether Firebase HTTPS functions are deployed
        run: |
          node --input-type=module <<'NODE'
          const endpoints = [
            ['adminLogin', 'https://asia-east1-csu-order-system-af6bb.cloudfunctions.net/adminLogin'],
            ['publicBookingApi', 'https://asia-east1-csu-order-system-af6bb.cloudfunctions.net/publicBookingApi']
          ];
          for (const [name, url] of endpoints) {
            try {
              const res = await fetch(url, { method: 'GET', signal: AbortSignal.timeout(15000) });
              const body = (await res.text()).slice(0, 300).replace(/\s+/g, ' ');
              console.log(`${name}: HTTP ${res.status}; content-type=${res.headers.get('content-type')}; body=${body}`);
              if (res.status === 405) console.log(`${name}: endpoint exists (GET correctly rejected; POST is expected).`);
              else if (res.status === 404) console.log(`${name}: endpoint likely not deployed at this URL.`);
            } catch (e) {
              console.log(`${name}: NETWORK ERROR ${e.name}: ${e.message}`);
            }
          }
          NODE
