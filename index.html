<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172b3a">
<meta name="description" content="正修建築空間預約、設備借用與工坊管理平台">
<title>正修建築｜空間預約與設備借用</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="./"><span class="brand-mark">築</span><span><b>正修建築圖科</b><small>空間預約・設備借用管理平台</small></span></a>
  <button id="adminOpen" class="outline">管理員後台</button>
</header>
<main>
  <section class="hero">
    <span class="eyebrow">STUDIO SERVICE · CSU</span>
    <h1>讓空間與設備借用<br><em>更簡單、更清楚。</em></h1>
    <p>選擇服務，確認規範並送出申請。系統會檢查已登記的課表與時段占用。</p>
    <div class="chips"><span>時段檢查</span><span>簽到／簽退</span><span>照片回傳</span></div>
  </section>
  <nav id="tabs" class="tabs" aria-label="主要服務">
    <button class="tab active" data-view="booking">空間預約</button>
    <button class="tab" data-view="borrowing">雙向借用</button>
    <button class="tab" data-view="micro">借用正修微工坊</button>
    <button class="tab" data-view="output">借用出圖室</button>
    <button class="tab" data-view="records">我的申請／簽到簽退</button>
  </nav>
  <div id="startupStatus" class="notice hidden" role="status"></div>
  <section id="view" class="panel" aria-live="polite"></section>
  <footer>正修科技大學建築相關空間管理｜請依管理員公告及現場規範使用</footer>
</main>
<div id="adminModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
  <div class="modal-card">
    <button id="adminClose" class="modal-close" aria-label="關閉">×</button>
    <h2 id="adminTitle">管理員後台</h2>
    <p class="muted">學生免登入。管理員請使用專用帳號與密碼登入。</p>
    <label class="field">管理員帳號<input id="adminEmail" type="text" autocomplete="username" placeholder="輸入管理員帳號"></label>
    <label class="field">密碼<input id="adminPassword" type="password" autocomplete="current-password"></label>
    <button id="loginBtn" class="primary full">登入後台</button>
    <p id="loginError" class="error"></p>
    <div id="adminPanel" class="hidden"></div>
  </div>
</div>
<div id="toast" class="toast" role="status"></div>
<script>
(function(){
  var labels={booking:"空間預約",borrowing:"雙向借用",micro:"借用正修微工坊",output:"借用出圖室",records:"我的申請／簽到簽退"};
  var ready=false, status=document.getElementById("startupStatus");
  window.addEventListener("csu-app-ready",function(){ready=true;if(status)status.classList.add("hidden");});
  window.addEventListener("error",function(e){if(status){status.classList.remove("hidden");status.textContent="網頁互動程式發生錯誤："+(e.message||"未知錯誤")+"。請查看 GitHub Actions 部署紀錄。";}});
  window.addEventListener("unhandledrejection",function(e){if(status){status.classList.remove("hidden");status.textContent="網頁啟動失敗："+(e.reason&&e.reason.message||e.reason||"未知錯誤")+"。";}});
  document.addEventListener("click",function(e){
    var tab=e.target.closest&&e.target.closest(".tab");
    if(tab){
      document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("active",b===tab);});
      if(!ready){
        var v=document.getElementById("view");
        if(v)v.innerHTML="<h2>"+labels[tab.dataset.view]+"</h2><p>正在等待主程式載入。若一直停留在這裡，代表網站程式仍有啟動錯誤；請查看頁面上方的錯誤提示。</p>";
      }
    }
    if(e.target.closest&&e.target.closest("#adminOpen"))document.getElementById("adminModal").classList.remove("hidden");
    if(e.target.closest&&e.target.closest("#adminClose"))document.getElementById("adminModal").classList.add("hidden");
  },true);
  setTimeout(function(){
    if(!ready&&status){
      status.classList.remove("hidden");
      status.textContent="主程式在 5 秒內尚未啟動。上方分頁和管理員視窗仍可點擊；申請功能尚未就緒。此提示會協助找出發佈或 JavaScript 載入錯誤。";
    }
  },5000);
})();
</script>
<script defer src="app.js"></script>
</body>
</html>
